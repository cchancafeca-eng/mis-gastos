<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0f172a"/>
<title>💰 Mis Gastos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:#0f172a;font-family:'Segoe UI',system-ui,sans-serif;color:#f1f5f9;overscroll-behavior:none;}
  input:focus{outline:2px solid #6366f1;}
  ::-webkit-scrollbar{width:4px;} ::-webkit-scrollbar-track{background:#0f172a;} ::-webkit-scrollbar-thumb{background:#334155;border-radius:99px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const CATEGORIES = ["🏠 Vivienda","🛒 Alimentación","🚗 Transporte","💡 Suministros","🎉 Ocio","✈️ Viajes","👗 Ropa","💊 Salud","📱 Tecnología","🍽️ Restaurantes","📚 Educación","🐾 Mascotas","💳 Otros"];
const CAT_COLORS = {"🏠 Vivienda":"#6366f1","🛒 Alimentación":"#22c55e","🚗 Transporte":"#f59e0b","💡 Suministros":"#eab308","🎉 Ocio":"#ec4899","✈️ Viajes":"#06b6d4","👗 Ropa":"#a855f7","💊 Salud":"#ef4444","📱 Tecnología":"#3b82f6","🍽️ Restaurantes":"#f97316","📚 Educación":"#14b8a6","🐾 Mascotas":"#84cc16","💳 Otros":"#6b7280"};
const MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const STORAGE_KEY = "gastos_app_v2";
const fmt = n => String(n).padStart(2,"0");
const today = new Date();

function loadData() {
  try { const r = localStorage.getItem(STORAGE_KEY); if(r) return JSON.parse(r); } catch{}
  return { people:["Yo"], expenses:[], savings:{} };
}
function saveData(d) { try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(d)); }catch{} }

const inp = { width:"100%", background:"#0f172a", border:"1px solid #334155", borderRadius:12, color:"#f1f5f9", padding:"12px 14px", fontSize:14, outline:"none", boxSizing:"border-box" };

function MonthNav({viewMonth,viewYear,setViewMonth,setViewYear}){
  const prev=()=>{ if(viewMonth===0){setViewMonth(11);setViewYear(y=>y-1);}else setViewMonth(m=>m-1); };
  const next=()=>{ if(viewMonth===11){setViewMonth(0);setViewYear(y=>y+1);}else setViewMonth(m=>m+1); };
  return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:16,margin:"0 0 16px"}}>
      <button onClick={prev} style={{background:"#334155",border:"none",color:"#f1f5f9",borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:16}}>‹</button>
      <span style={{fontWeight:700,fontSize:16}}>{MONTHS[viewMonth]} {viewYear}</span>
      <button onClick={next} style={{background:"#334155",border:"none",color:"#f1f5f9",borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:16}}>›</button>
    </div>
  );
}

function Dashboard({data,monthExpenses,viewMonth,viewYear,setViewMonth,setViewYear,savingGoal}){
  const total=monthExpenses.reduce((s,e)=>s+e.amount,0);
  const byPerson={};
  data.people.forEach(p=>{byPerson[p]=0;});
  monthExpenses.forEach(e=>{(e.people||[e.person]).forEach(p=>{if(byPerson[p]!==undefined)byPerson[p]+=e.amount/(e.people||[e.person]).length;});});
  const byCat={};
  monthExpenses.forEach(e=>{byCat[e.category]=(byCat[e.category]||0)+e.amount;});
  const catSorted=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxCat=catSorted[0]?.[1]||1;
  const margin=savingGoal.goal?savingGoal.goal-total:null;
  const canAfford=margin!==null&&margin>0;
  return(
    <div style={{padding:16}}>
      <h2 style={{margin:"16px 0 4px",fontSize:22,fontWeight:800}}>💰 Mi Presupuesto</h2>
      <p style={{color:"#94a3b8",marginBottom:16,fontSize:13}}>Gestiona tus gastos y ahorro</p>
      <MonthNav viewMonth={viewMonth} viewYear={viewYear} setViewMonth={setViewMonth} setViewYear={setViewYear}/>
      <div style={{background:"linear-gradient(135deg,#6366f1,#8b5cf6)",borderRadius:20,padding:24,marginBottom:16,textAlign:"center"}}>
        <div style={{fontSize:13,color:"#c7d2fe",marginBottom:4}}>Gasto total del mes</div>
        <div style={{fontSize:42,fontWeight:800}}>{total.toFixed(2)}€</div>
        {savingGoal.goal>0&&<div style={{fontSize:13,color:"#c7d2fe",marginTop:4}}>Presupuesto: {savingGoal.goal.toFixed(2)}€</div>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
        {data.people.map(p=>(
          <div key={p} style={{background:"#1e293b",borderRadius:16,padding:16}}>
            <div style={{fontSize:12,color:"#94a3b8"}}>👤 {p}</div>
            <div style={{fontSize:22,fontWeight:700,marginTop:4}}>{(byPerson[p]||0).toFixed(2)}€</div>
          </div>
        ))}
      </div>
      {catSorted.length>0&&(
        <div style={{background:"#1e293b",borderRadius:16,padding:16,marginBottom:16}}>
          <div style={{fontWeight:700,marginBottom:12,fontSize:14}}>📊 Top categorías</div>
          {catSorted.map(([cat,amt])=>(
            <div key={cat} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}>
                <span>{cat}</span><span style={{fontWeight:600}}>{amt.toFixed(2)}€</span>
              </div>
              <div style={{background:"#0f172a",borderRadius:99,height:6}}>
                <div style={{background:CAT_COLORS[cat]||"#6366f1",borderRadius:99,height:6,width:`${(amt/maxCat)*100}%`}}/>
              </div>
            </div>
          ))}
        </div>
      )}
      {savingGoal.goal>0&&(
        <div style={{background:canAfford?"#052e16":"#1e293b",border:`1px solid ${canAfford?"#16a34a":"#ef4444"}`,borderRadius:16,padding:16}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>{canAfford?"✅ ¿Qué podemos permitirnos?":"⚠️ Atención al presupuesto"}</div>
          {canAfford
            ?<div style={{color:"#86efac",fontSize:13}}>Os quedan <b>{margin.toFixed(2)}€</b> de margen. ¡Podríais adelantar un pago o planear algo especial!</div>
            :<div style={{color:"#fca5a5",fontSize:13}}>Lleváis <b>{Math.abs(margin).toFixed(2)}€</b> por encima del presupuesto.</div>
          }
        </div>
      )}
      {savingGoal.goal===0&&monthExpenses.length===0&&(
        <div style={{textAlign:"center",color:"#475569",padding:32}}>
          <div style={{fontSize:40}}>🌟</div>
          <div style={{marginTop:8}}>Empieza añadiendo tus gastos<br/>y configura un presupuesto</div>
        </div>
      )}
    </div>
  );
}

function AddExpense({data,persist}){
  const [form,setForm]=useState({date:`${today.getFullYear()}-${fmt(today.getMonth()+1)}-${fmt(today.getDate())}`,description:"",amount:"",category:CATEGORIES[0],people:["Yo"],note:""});
  const [saved,setSaved]=useState(false);
  const toggle=p=>setForm(f=>({...f,people:f.people.includes(p)?f.people.filter(x=>x!==p):[...f.people,p]}));
  const submit=()=>{
    if(!form.amount||!form.description)return;
    const e={id:Date.now(),...form,amount:parseFloat(form.amount)};
    persist({...data,expenses:[...data.expenses,e]});
    setForm(f=>({...f,description:"",amount:"",note:""}));
    setSaved(true);setTimeout(()=>setSaved(false),1500);
  };
  return(
    <div style={{padding:16}}>
      <h2 style={{margin:"16px 0 16px",fontSize:22,fontWeight:800}}>➕ Añadir Gasto</h2>
      {saved&&<div style={{background:"#052e16",border:"1px solid #16a34a",borderRadius:12,padding:12,marginBottom:16,color:"#86efac",textAlign:"center"}}>✅ Gasto guardado</div>}
      {[
        {label:"📅 Fecha",el:<input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} style={inp}/>},
        {label:"📝 Descripción",el:<input placeholder="Ej: Supermercado Mercadona" value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} style={inp}/>},
        {label:"💶 Importe (€)",el:<input type="number" placeholder="0.00" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} style={inp} min="0" step="0.01"/>},
      ].map(({label,el})=>(
        <div key={label} style={{marginBottom:14}}>
          <div style={{fontSize:12,color:"#94a3b8",marginBottom:6}}>{label}</div>
          {el}
        </div>
      ))}
      <div style={{marginBottom:14}}>
        <div style={{fontSize:12,color:"#94a3b8",marginBottom:8}}>🏷️ Categoría</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
          {CATEGORIES.map(c=>(
            <button key={c} onClick={()=>setForm(f=>({...f,category:c}))} style={{padding:"6px 12px",borderRadius:99,border:"none",cursor:"pointer",fontSize:12,background:form.category===c?(CAT_COLORS[c]||"#6366f1"):"#1e293b",color:"#f1f5f9",fontWeight:form.category===c?700:400}}>{c}</button>
          ))}
        </div>
      </div>
      <div style={{marginBottom:14}}>
        <div style={{fontSize:12,color:"#94a3b8",marginBottom:8}}>👥 Asignar a</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {data.people.map(p=>(
            <button key={p} onClick={()=>toggle(p)} style={{padding:"8px 16px",borderRadius:99,border:`2px solid ${form.people.includes(p)?"#6366f1":"#334155"}`,background:form.people.includes(p)?"#6366f1":"transparent",color:"#f1f5f9",cursor:"pointer",fontSize:13,fontWeight:600}}>{p}</button>
          ))}
        </div>
        {data.people.length>1&&<div style={{fontSize:11,color:"#64748b",marginTop:6}}>Si seleccionas varios, el gasto se divide equitativamente</div>}
      </div>
      <div style={{marginBottom:20}}>
        <div style={{fontSize:12,color:"#94a3b8",marginBottom:6}}>🗒️ Nota (opcional)</div>
        <input placeholder="Añade un comentario..." value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))} style={inp}/>
      </div>
      <button onClick={submit} disabled={!form.amount||!form.description} style={{width:"100%",padding:16,background:form.amount&&form.description?"linear-gradient(135deg,#6366f1,#8b5cf6)":"#334155",border:"none",borderRadius:16,color:"#fff",fontSize:16,fontWeight:700,cursor:form.amount&&form.description?"pointer":"default"}}>
        Guardar Gasto
      </button>
    </div>
  );
}

function ExpenseList({data,persist,monthExpenses,viewMonth,viewYear,setViewMonth,setViewYear}){
  const [filter,setFilter]=useState("Todos");
  const people=["Todos",...data.people];
  const filtered=filter==="Todos"?monthExpenses:monthExpenses.filter(e=>(e.people||[e.person]).includes(filter));
  const sorted=[...filtered].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const del=id=>{if(confirm("¿Eliminar este gasto?"))persist({...data,expenses:data.expenses.filter(e=>e.id!==id)});};
  const exportCSV=()=>{
    const rows=[["Fecha","Descripción","Importe","Categoría","Personas","Nota"]];
    monthExpenses.forEach(e=>rows.push([e.date,e.description,e.amount,e.category,(e.people||[e.person]).join("+"),e.note||""]));
    const csv=rows.map(r=>r.join(",")).join("\n");
    const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
    a.download=`gastos_${MONTHS[viewMonth]}_${viewYear}.csv`;a.click();
  };
  return(
    <div style={{padding:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",margin:"16px 0 16px"}}>
        <h2 style={{margin:0,fontSize:22,fontWeight:800}}>📋 Gastos</h2>
        <button onClick={exportCSV} style={{background:"#1e293b",border:"1px solid #334155",borderRadius:10,color:"#94a3b8",padding:"6px 12px",cursor:"pointer",fontSize:12}}>⬇️ Exportar CSV</button>
      </div>
      <MonthNav viewMonth={viewMonth} viewYear={viewYear} setViewMonth={setViewMonth} setViewYear={setViewYear}/>
      <div style={{display:"flex",gap:8,marginBottom:16,overflowX:"auto",paddingBottom:4}}>
        {people.map(p=>(
          <button key={p} onClick={()=>setFilter(p)} style={{padding:"6px 14px",borderRadius:99,border:"none",cursor:"pointer",fontSize:12,whiteSpace:"nowrap",background:filter===p?"#6366f1":"#1e293b",color:"#f1f5f9",fontWeight:filter===p?700:400}}>{p}</button>
        ))}
      </div>
      {sorted.length===0?(
        <div style={{textAlign:"center",color:"#475569",padding:40}}>No hay gastos este mes</div>
      ):sorted.map(e=>(
        <div key={e.id} style={{background:"#1e293b",borderRadius:16,padding:14,marginBottom:10,display:"flex",gap:12,alignItems:"flex-start"}}>
          <div style={{width:40,height:40,borderRadius:12,background:(CAT_COLORS[e.category]||"#6366f1")+"33",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{e.category.split(" ")[0]}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:600,fontSize:14,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.description}</div>
            <div style={{fontSize:11,color:"#64748b",marginTop:2}}>{e.date} · {(e.people||[e.person]).join(", ")}</div>
            {e.note&&<div style={{fontSize:11,color:"#94a3b8",marginTop:2,fontStyle:"italic"}}>{e.note}</div>}
          </div>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontWeight:700,fontSize:16}}>{e.amount.toFixed(2)}€</div>
            <button onClick={()=>del(e.id)} style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:11,marginTop:2}}>🗑️</button>
          </div>
        </div>
      ))}
      {sorted.length>0&&(
        <div style={{background:"#1e293b",borderRadius:16,padding:14,marginTop:8,display:"flex",justifyContent:"space-between"}}>
          <span style={{fontWeight:600}}>Total ({filtered.length} gastos)</span>
          <span style={{fontWeight:800,fontSize:18}}>{filtered.reduce((s,e)=>s+e.amount,0).toFixed(2)}€</span>
        </div>
      )}
    </div>
  );
}

function People({data,persist,monthExpenses}){
  const [newName,setNewName]=useState("");
  const add=()=>{if(newName.trim()&&!data.people.includes(newName.trim())){persist({...data,people:[...data.people,newName.trim()]});setNewName("");}};
  const remove=p=>{if(data.people.length<=1)return;if(confirm(`¿Eliminar a ${p}?`))persist({...data,people:data.people.filter(x=>x!==p)});};
  return(
    <div style={{padding:16}}>
      <h2 style={{margin:"16px 0 16px",fontSize:22,fontWeight:800}}>👥 Personas</h2>
      {data.people.map(p=>{
        const total=monthExpenses.reduce((s,e)=>s+((e.people||[e.person]).includes(p)?e.amount/(e.people||[e.person]).length:0),0);
        const myExp=monthExpenses.filter(e=>(e.people||[e.person]).includes(p));
        const byCat={};
        myExp.forEach(e=>{byCat[e.category]=(byCat[e.category]||0)+e.amount/(e.people||[e.person]).length;});
        const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
        return(
          <div key={p} style={{background:"#1e293b",borderRadius:20,padding:20,marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontSize:18,fontWeight:700}}>👤 {p}</div>
                <div style={{fontSize:32,fontWeight:800,marginTop:8,color:"#a5b4fc"}}>{total.toFixed(2)}€</div>
                <div style={{fontSize:12,color:"#64748b",marginTop:2}}>este mes · {myExp.length} gastos</div>
                {top&&<div style={{fontSize:12,color:"#94a3b8",marginTop:6}}>Mayor gasto: {top[0]} ({top[1].toFixed(2)}€)</div>}
              </div>
              {data.people.length>1&&<button onClick={()=>remove(p)} style={{background:"#0f172a",border:"1px solid #334155",borderRadius:8,color:"#ef4444",padding:"6px 10px",cursor:"pointer",fontSize:12}}>Eliminar</button>}
            </div>
          </div>
        );
      })}
      <div style={{background:"#1e293b",borderRadius:20,padding:20}}>
        <div style={{fontWeight:700,marginBottom:12}}>➕ Añadir persona</div>
        <div style={{display:"flex",gap:10}}>
          <input value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Nombre..." style={{...inp,flex:1}}/>
          <button onClick={add} style={{background:"#6366f1",border:"none",borderRadius:12,color:"#fff",padding:"0 18px",cursor:"pointer",fontWeight:700,fontSize:16}}>+</button>
        </div>
      </div>
    </div>
  );
}

function Savings({data,persist,monthKey,savingGoal,monthExpenses,viewMonth,viewYear,setViewMonth,setViewYear}){
  const [goal,setGoal]=useState(savingGoal.goal||"");
  const [saved,setSaved]=useState(savingGoal.saved||"");
  useEffect(()=>{
    const s=data.savings[monthKey]||{goal:0,saved:0};
    setGoal(s.goal||"");setSaved(s.saved||"");
  },[monthKey,data.savings]);
  const total=monthExpenses.reduce((s,e)=>s+e.amount,0);
  const g=parseFloat(goal)||0;
  const sv=parseFloat(saved)||0;
  const margin=g?g-total:0;
  const canAfford=g>0&&margin>0;
  const saveFn=()=>{persist({...data,savings:{...data.savings,[monthKey]:{goal:parseFloat(goal)||0,saved:parseFloat(saved)||0}}});};
  const suggestions=[];
  if(margin>200)suggestions.push({icon:"✈️",text:`Margen para un fin de semana (~${Math.floor(margin/200)*2} noches)`});
  if(margin>50)suggestions.push({icon:"🍽️",text:`Cena especial o salida (~${margin.toFixed(0)}€ disponibles)`});
  if(margin>100)suggestions.push({icon:"💳",text:`Adelantar un pago o cuota (${margin.toFixed(2)}€)`});
  if(sv>0)suggestions.push({icon:"🏦",text:`Ahorro acumulado: ${sv.toFixed(2)}€`});
  return(
    <div style={{padding:16}}>
      <h2 style={{margin:"16px 0 16px",fontSize:22,fontWeight:800}}>🎯 Ahorro y Presupuesto</h2>
      <MonthNav viewMonth={viewMonth} viewYear={viewYear} setViewMonth={setViewMonth} setViewYear={setViewYear}/>
      <div style={{background:"#1e293b",borderRadius:20,padding:20,marginBottom:16}}>
        <div style={{fontWeight:700,marginBottom:16}}>Configurar mes</div>
        {[
          {label:"💰 Presupuesto mensual (€)",val:goal,set:setGoal,ph:"Ej: 2000"},
          {label:"🏦 Ahorro apartado (€)",val:saved,set:setSaved,ph:"Ej: 300"},
        ].map(({label,val,set,ph})=>(
          <div key={label} style={{marginBottom:14}}>
            <div style={{fontSize:12,color:"#94a3b8",marginBottom:6}}>{label}</div>
            <input type="number" placeholder={ph} value={val} onChange={e=>set(e.target.value)} style={inp} min="0"/>
          </div>
        ))}
        <button onClick={saveFn} style={{width:"100%",padding:14,background:"linear-gradient(135deg,#6366f1,#8b5cf6)",border:"none",borderRadius:14,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>Guardar</button>
      </div>
      {g>0&&(
        <div style={{background:"#1e293b",borderRadius:20,padding:20,marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}>
            <div><div style={{fontSize:12,color:"#94a3b8"}}>Gastado</div><div style={{fontSize:24,fontWeight:800,color:total>g?"#f87171":"#f1f5f9"}}>{total.toFixed(2)}€</div></div>
            <div style={{textAlign:"center"}}><div style={{fontSize:12,color:"#94a3b8"}}>Presupuesto</div><div style={{fontSize:24,fontWeight:800}}>{g.toFixed(2)}€</div></div>
            <div style={{textAlign:"right"}}><div style={{fontSize:12,color:"#94a3b8"}}>Margen</div><div style={{fontSize:24,fontWeight:800,color:margin>=0?"#4ade80":"#f87171"}}>{margin.toFixed(2)}€</div></div>
          </div>
          <div style={{background:"#0f172a",borderRadius:99,height:10,marginBottom:8}}>
            <div style={{background:total/g>1?"#ef4444":total/g>0.8?"#f59e0b":"#22c55e",borderRadius:99,height:10,width:`${Math.min((total/g)*100,100)}%`}}/>
          </div>
          <div style={{fontSize:12,color:"#64748b",textAlign:"right"}}>{((total/g)*100).toFixed(1)}% del presupuesto</div>
        </div>
      )}
      {sv>0&&(
        <div style={{background:"#1e293b",borderRadius:20,padding:20,marginBottom:16}}>
          <div style={{fontWeight:700,marginBottom:12}}>🏦 Ahorro apartado este mes</div>
          <div style={{fontSize:32,fontWeight:800,color:"#6ee7b7"}}>{sv.toFixed(2)}€</div>
        </div>
      )}
      {suggestions.length>0&&(
        <div style={{background:"#1e293b",borderRadius:20,padding:20}}>
          <div style={{fontWeight:700,marginBottom:12}}>💡 ¿Qué podéis hacer?</div>
          {suggestions.map((s,i)=>(
            <div key={i} style={{display:"flex",gap:12,alignItems:"center",padding:"10px 0",borderBottom:i<suggestions.length-1?"1px solid #334155":"none"}}>
              <span style={{fontSize:24}}>{s.icon}</span>
              <span style={{fontSize:14,color:"#cbd5e1"}}>{s.text}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function App(){
  const [tab,setTab]=useState(0);
  const [data,setData]=useState(loadData);
  const [viewMonth,setViewMonth]=useState(today.getMonth());
  const [viewYear,setViewYear]=useState(today.getFullYear());
  const persist=useCallback(d=>{setData(d);saveData(d);},[]);
  const monthExpenses=data.expenses.filter(e=>{
    const d=new Date(e.date);
    return d.getMonth()===viewMonth&&d.getFullYear()===viewYear;
  });
  const monthKey=`${viewYear}-${fmt(viewMonth+1)}`;
  const savingGoal=data.savings[monthKey]||{goal:0,saved:0};
  const tabs=[{icon:"📊",label:"Resumen"},{icon:"➕",label:"Añadir"},{icon:"📋",label:"Gastos"},{icon:"👥",label:"Personas"},{icon:"🎯",label:"Ahorro"}];
  return(
    <div style={{fontFamily:"'Segoe UI',sans-serif",background:"#0f172a",minHeight:"100vh",color:"#f1f5f9",maxWidth:480,margin:"0 auto",display:"flex",flexDirection:"column",height:"100vh"}}>
      <div style={{flex:1,overflowY:"auto",paddingBottom:80}}>
        {tab===0&&<Dashboard data={data} monthExpenses={monthExpenses} viewMonth={viewMonth} viewYear={viewYear} setViewMonth={setViewMonth} setViewYear={setViewYear} savingGoal={savingGoal}/>}
        {tab===1&&<AddExpense data={data} persist={persist}/>}
        {tab===2&&<ExpenseList data={data} persist={persist} monthExpenses={monthExpenses} viewMonth={viewMonth} viewYear={viewYear} setViewMonth={setViewMonth} setViewYear={setViewYear}/>}
        {tab===3&&<People data={data} persist={persist} monthExpenses={monthExpenses}/>}
        {tab===4&&<Savings data={data} persist={persist} monthKey={monthKey} savingGoal={savingGoal} monthExpenses={monthExpenses} viewMonth={viewMonth} viewYear={viewYear} setViewMonth={setViewMonth} setViewYear={setViewYear}/>}
      </div>
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:"#1e293b",borderTop:"1px solid #334155",display:"flex"}}>
        {tabs.map((t,i)=>(
          <button key={i} onClick={()=>setTab(i)} style={{flex:1,padding:"10px 0 8px",background:"none",border:"none",color:tab===i?"#6366f1":"#64748b",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
            <span style={{fontSize:20}}>{t.icon}</span>
            <span style={{fontSize:10,fontWeight:tab===i?700:400}}>{t.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
